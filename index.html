<body>

    <div class="container">

        <h1>IST Time Converter</h1>

        <div class="subtitle">
            Convert GMT+2 / GMT+3 to Indian Standard Time
        </div>


        <!-- TIMEZONE BUTTONS -->

        <div class="timezone-buttons">

            <button
                id="gmt2"
                onclick="selectTimezone(2)">
                GMT +2
            </button>

            <button
                id="gmt3"
                class="active"
                onclick="selectTimezone(3)">
                GMT +3
            </button>

        </div>


        <!-- TIME INPUT -->

        <div class="input-section">

            <label for="timeInput">
                Enter Time (24 Hour)
            </label>

            <input
                type="text"
                id="timeInput"
                value="12:00"
                placeholder="HH:MM"
                maxlength="5"
                inputmode="numeric"
                autocomplete="off"
                oninput="handleInput()">

            <div class="error" id="error"></div>

        </div>


        <!-- RESULT -->

        <div class="result">

            <div class="result-label">
                IST
            </div>

            <div
                class="result-time"
                id="result">
                14:30
            </div>

            <div class="timezone-name">
                GMT +5:30 · India
            </div>

        </div>

    </div>


    <script>

        // ==========================================
        // SETTINGS
        // ==========================================

        // GMT +3 is selected by default
        let selectedTimezone = 3;


        // ==========================================
        // TIMEZONE SELECTION
        // ==========================================

        function selectTimezone(timezone) {

            selectedTimezone = timezone;

            document
                .getElementById("gmt2")
                .classList.remove("active");

            document
                .getElementById("gmt3")
                .classList.remove("active");


            if (timezone === 2) {

                document
                    .getElementById("gmt2")
                    .classList.add("active");

            } else {

                document
                    .getElementById("gmt3")
                    .classList.add("active");

            }


            convertTime();
        }


        // ==========================================
        // INPUT HANDLING
        // ==========================================

        function handleInput() {

            const input =
                document.getElementById("timeInput");

            let value = input.value;

            // Keep only numbers
            value = value.replace(/\D/g, "");

            // Maximum 4 digits
            value = value.substring(0, 4);


            // Automatically add :
            if (value.length > 2) {

                value =
                    value.substring(0, 2) +
                    ":" +
                    value.substring(2);

            }


            input.value = value;

            convertTime();
        }


        // ==========================================
        // TIME CONVERSION
        // ==========================================

        function convertTime() {

            const timeInput =
                document.getElementById("timeInput").value;

            const error =
                document.getElementById("error");


            // Require HH:MM
            const match =
                timeInput.match(
                    /^([0-2][0-9]):([0-5][0-9])$/
                );


            if (!match) {

                error.textContent =
                    "Enter time as HH:MM";

                return;
            }


            const hours =
                Number(match[1]);

            const minutes =
                Number(match[2]);


            // Hours must be 00–23
            if (hours > 23) {

                error.textContent =
                    "Hours must be between 00 and 23";

                return;
            }


            error.textContent = "";


            // ======================================
            // GMT → IST
            //
            // IST = GMT +5:30
            //
            // GMT+2 → IST = +3:30
            // GMT+3 → IST = +2:30
            // ======================================

            const difference =
                5.5 - selectedTimezone;


            let totalMinutes =
                (hours * 60) +
                minutes +
                (difference * 60);


            // Handle crossing midnight

            totalMinutes =
                ((totalMinutes % 1440) + 1440) % 1440;


            const resultHours =
                Math.floor(totalMinutes / 60);

            const resultMinutes =
                totalMinutes % 60;


            const formattedHours =
                String(resultHours)
                    .padStart(2, "0");

            const formattedMinutes =
                String(resultMinutes)
                    .padStart(2, "0");


            document
                .getElementById("result")
                .textContent =
                `${formattedHours}:${formattedMinutes}`;
        }


        // ==========================================
        // INITIAL CONVERSION
        // ==========================================

        convertTime();

    </script>

</body>
